<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toca na Lagoa</title>
  <meta name="theme-color" content="#22408F">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Applied before the app loads so the page never flashes the wrong theme.
    try {
      const stored = localStorage.getItem('theme');
      if (stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (error) {}
  </script>
</head>
<body class="h-full bg-tinta-50 text-tinta-800 antialiased dark:bg-tinta-950 dark:text-tinta-200">
  <div id="app" class="min-h-full"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
